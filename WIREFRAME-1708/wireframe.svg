<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2100" viewBox="0 0 1440 2100" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe BloomHouse</title>
  <desc id="desc">Wireframe halaman BloomHouse yang menampilkan Home, Galeri, Tentang, Kontak, sidebar testimoni, dan footer.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #173b2a; }
      .label { font-size: 20px; font-weight: 700; }
      .sub { font-size: 14px; fill: #557060; }
      .frame { fill: #fff; stroke: #8da696; stroke-width: 2; }
      .image { fill: #e8eee7; stroke: #aab9ad; stroke-width: 1.5; }
      .accent { fill: #ffebe6; stroke: #ff6347; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1440" height="2100" fill="#f7f8f4"/>
  <rect x="80" y="40" width="1280" height="84" rx="16" class="frame"/>
