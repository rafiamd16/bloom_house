  <rect x="518" y="735" width="405" height="270" rx="20" class="frame"/><rect x="533" y="750" width="375" height="135" rx="14" class="image"/><text x="548" y="925" class="label">Tentang</text><text x="548" y="955" class="sub">Deskripsi dan tautan section</text>
  <rect x="956" y="735" width="404" height="270" rx="20" class="frame"/><rect x="971" y="750" width="374" height="135" rx="14" class="image"/><text x="986" y="925" class="label">Kontak</text><text x="986" y="955" class="sub">Deskripsi dan tautan section</text>
  <rect x="80" y="1050" width="880" height="620" rx="24" class="frame"/><text x="110" y="1100" class="label">GALERI · BUKET BUNGA &amp; TANAMAN HIAS</text>
